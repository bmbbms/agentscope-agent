version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: mvp-postgres
    environment:
      POSTGRES_DB: agent_audit
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_audit"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mvp_pg_data:/var/lib/postgresql/data

  audit-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp-audit-ingest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AGENT_AUDIT_PG_DSN: postgresql://agent_user:agent_pass@postgres:5432/agent_audit
      AUDIT_INGEST_TOKEN: ingest-token
      PYTHONPATH: /app/src
      AUDIT_SCHEMA_SQL_PATH: /app/sql/audit_schema.sql
    command: >
      sh -c "python /app/scripts/wait_for_postgres.py &&
             uvicorn audit_ingest_api:app --host 0.0.0.0 --port 8081"
    ports:
      - "8081:8081"

  child-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp-child-agent
    depends_on:
      audit-ingest:
        condition: service_started
    environment:
      PYTHONPATH: /app/src
    command: uvicorn child_agent_http_example:app --host 0.0.0.0 --port 8091
    ports:
      - "8091:8091"

  report-child-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp-report-child-agent
    depends_on:
      audit-ingest:
        condition: service_started
    environment:
      PYTHONPATH: /app/src
      SUPERSET_BASE_URL: ${SUPERSET_BASE_URL:-}
      SUPERSET_USERNAME: ${SUPERSET_USERNAME:-}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-}
      SUPERSET_PASSWORD_ENCRYPTED: ${SUPERSET_PASSWORD_ENCRYPTED:-}
      SUPERSET_DATABASE: ${SUPERSET_DATABASE:-}
    command: uvicorn report_child_agent_http_api:app --host 0.0.0.0 --port 8092
    ports:
      - "8092:8092"

  data-query-child-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp-data-query-child-agent
    depends_on:
      audit-ingest:
        condition: service_started
    environment:
      PYTHONPATH: /app/src
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AGENTSCOPE_MODEL_NAME: ${AGENTSCOPE_MODEL_NAME:-gpt-4o-mini}
      SUPERSET_BASE_URL: ${SUPERSET_BASE_URL:-}
      SUPERSET_USERNAME: ${SUPERSET_USERNAME:-}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-}
      SUPERSET_PASSWORD_ENCRYPTED: ${SUPERSET_PASSWORD_ENCRYPTED:-}
      SUPERSET_SCHEMA_DIR: ${SUPERSET_SCHEMA_DIR:-/app/superset_data_query/BI数据表结构全量}
    command: uvicorn data_query_child_agent_http_api:app --host 0.0.0.0 --port 8093
    ports:
      - "8093:8093"

  main-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvp-main-agent
    depends_on:
      audit-ingest:
        condition: service_started
      child-agent:
        condition: service_started
      report-child-agent:
        condition: service_started
      data-query-child-agent:
        condition: service_started
    environment:
      AGENT_AUDIT_PG_DSN: postgresql://agent_user:agent_pass@postgres:5432/agent_audit
      MAIN_AGENT_API_TOKEN: main-token
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AGENTSCOPE_MODEL_NAME: ${AGENTSCOPE_MODEL_NAME:-gpt-4o-mini}
      AUDIT_INGEST_URL: http://audit-ingest:8081/audit/events
      AUDIT_INGEST_TOKEN: ingest-token
      MERCHANT_REMOTE_AGENTS_JSON: >
        [{"name":"diagnosis","protocol":"http","url":"http://child-agent:8091/invoke"},
         {"name":"metric_definition","protocol":"http","url":"http://child-agent:8091/invoke"},
         {"name":"report","protocol":"http","url":"http://report-child-agent:8092/invoke","timeout_seconds":180},
         {"name":"data_query","protocol":"http","url":"http://data-query-child-agent:8093/invoke","timeout_seconds":180}]
      PYTHONPATH: /app/src
      AUDIT_SCHEMA_SQL_PATH: /app/sql/audit_schema.sql
    command: >
      sh -c "python /app/scripts/wait_for_postgres.py &&
             uvicorn main_agent_http_api:app --host 0.0.0.0 --port 8090"
    ports:
      - "8090:8090"

volumes:
  mvp_pg_data:
